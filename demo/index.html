<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotelFlow Demo — Stop chasing cleaners on WhatsApp & radio</title>
<meta name="description" content="See how HotelFlow gives your floor team an AI Agent that prioritizes rooms in real time.">

<!-- Open Graph: para que se vea bien si alguien comparte este link -->
<meta property="og:title" content="HotelFlow — Stop chasing cleaners on WhatsApp & radio">
<meta property="og:description" content="An AI Agent that auto-priorizes rooms in real time, right on your team's phone.">
<meta property="og:image" content="/demo/poster.jpg">
<meta property="og:type" content="website">

<style>
  :root {
    --bg: #0d0f1d;
    --border: #2d2b55;
    --text-main: #fdfdfd;   /* blanco no-puro a propósito: ver nota abajo */
    --text-body: #cbd5e1;
    --text-muted: #94a3b8;
    --text-footer: #64748b;
    --violet: #8b5cf6;
    --magenta: #d946ef;
    --violet-deep: #7c3aed;
    --magenta-deep: #c026d3;
    --blue: #38bdf8;
    --orange: #fb923c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  main {
    width: 100%;
    max-width: 720px;
  }

  .badge {
    display: inline-block;
    background-color: rgba(139, 92, 246, 0.15);
    border: 1px solid var(--violet);
    border-radius: 20px;
    padding: 4px 14px;
    color: #c4b5fd;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  h1 {
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.15;
    font-weight: 800;
    margin: 0 0 16px 0;
    letter-spacing: -1px;
  }

  .intro {
    color: var(--text-body);
    font-size: 16px;
    line-height: 1.6;
    margin: 0 0 32px 0;
    max-width: 560px;
  }

  .video-wrap {
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(124, 58, 237, 0.25);
    margin-bottom: 32px;
    background-color: #000;
  }

  video {
    width: 100%;
    display: block;
  }

  .fine-print {
    color: var(--text-muted);
    font-size: 13px;
    margin: 12px 0 0 0;
    text-align: center;
  }

  .cta-wrapper {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    margin-top: 12px;
  }

  .cta {
    display: inline-block;
    background: linear-gradient(90deg, var(--violet-deep) 0%, var(--magenta-deep) 100%);
    color: var(--text-main);
    padding: 16px 32px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(192, 38, 211, 0.4);
  }

  .cta:hover {
    filter: brightness(1.08);
  }

  /* Removed footer styles */
</style>
</head>
<body>
  <main>
    <span class="badge">HotelFlow • AI Housekeeping</span>

    <h1>Stop chasing cleaners on WhatsApp &amp; radio.</h1>

    <p class="intro">
      HotelFlow gives your floor team an AI Agent that auto-prioritizes rooms
      in real time, right on their phone. Watch how it works in 25 seconds.
    </p>

    <div class="video-wrap">
      <video controls playsinline poster="/demo/poster.jpg">
        <source src="https://pub-e2db7621aab44a2ab5a4b64a163ec4e1.r2.dev/HotelFlow-video.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
    </div>

    <div class="cta-wrapper">
      <a class="cta" href="/#contacto">Claim Your Free Month →</a>
      <p class="fine-print">We onboard your team in 15 mins. No contracts, zero drama.</p>
    </div>
  </main>
</body>
</html>
